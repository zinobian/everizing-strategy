<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에버라이징 어드바이저 봇</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; padding: 24px; border-radius: 8px; margin-bottom: 24px; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .approval-box { background: #f0fdf4; border: 2px solid #16a34a; border-radius: 8px; padding: 20px; text-align: center; margin: 24px 0; }
        .btn { padding: 10px 24px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-approve { background: #16a34a; color: white; }
        .btn-approve:hover { background: #15803d; }
        .btn-modify { background: #e2e8f0; color: #475569; }
        .signal-card { padding: 16px; margin: 12px 0; border-left: 4px solid; border-radius: 4px; }
        .signal-critical { background: #fef2f2; border-left-color: #dc2626; }
        h2 { color: #2563eb; margin-top: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 어드바이저 봇 일일 분석</h1>
            <p>2026-08-02 (금) | 15:35 KST | 다음 분석: 2026-08-03 15:30</p>
        </div>

        <div class="section">
            <h2>📊 포트폴리오 현황</h2>
            <p><strong>평가액:</strong> 12,500,000 원</p>
            <p><strong>수익:</strong> +1,900,000 원 (+8.5%)</p>
        </div>

        <div class="section">
            <h2>🎯 오늘의 매매신호</h2>
            <div class="signal-card signal-critical">
                <strong>🔴 [긴급] TQQQ - 규칙1 익절 신호</strong>
                <p>현재가: $115.50 | 평단가: $98.20 | 수익률: +17.7%</p>
            </div>
        </div>

        <div class="approval-box">
            <h3>🎯 최종 승인</h3>
            <p><strong>TQQQ 규칙1 매도 신호</strong>에 대해 승인하시겠습니까?</p>
            <button class="btn btn-approve" onclick="approveSignal()">✓ 승인하기</button>
            <button class="btn btn-modify" onclick="modifySignal()">✏️ 수정</button>
            <button class="btn btn-modify" onclick="rejectSignal()">✗ 거부</button>
        </div>
    </div>

    <script>
        function approveSignal() {
            alert('✅ 승인 완료!\n\nTQQQ 매도 신호가 승인되었습니다.\n텔레그램으로 알림이 발송됩니다.');
            sendTelegram('TQQQ 익절 신호 승인됨!');
        }

        function modifySignal() {
            alert('✏️ 수정 모드');
        }

        function rejectSignal() {
            alert('✗ 거부됨');
        }

        function sendTelegram(msg) {
            fetch('/api/telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: 'signal',
                    data: { message: msg }
                })
            }).then(r => console.log('Telegram:', r))
              .catch(e => console.error('Error:', e));
        }
    </script>
</body>
</html>
