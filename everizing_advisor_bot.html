<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everizing 어드바이저 봇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        .portfolio-status {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .status-item:last-child {
            border-bottom: none;
        }
        .status-label {
            color: #666;
            font-weight: 500;
        }
        .status-value {
            color: #333;
            font-weight: bold;
        }
        .signal-section {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .signal-title {
            font-size: 18px;
            font-weight: bold;
            color: #856404;
            margin-bottom: 10px;
        }
        .signal-content {
            color: #856404;
            line-height: 1.6;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .approve-btn {
            background: #28a745;
            color: white;
        }
        .approve-btn:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        .modify-btn {
            background: #ffc107;
            color: #333;
        }
        .modify-btn:hover {
            background: #e0a800;
            transform: translateY(-2px);
        }
        .reject-btn {
            background: #dc3545;
            color: white;
        }
        .reject-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
        }
        .message-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Everizing 어드바이저 봇</h1>
        
        <div class="portfolio-status">
            <div class="status-item">
                <span class="status-label">포트폴리오 평가액</span>
                <span class="status-value">12,500,000 원</span>
            </div>
            <div class="status-item">
                <span class="status-label">오늘의 수익</span>
                <span class="status-value">+1,900,000 원 (+8.5%)</span>
            </div>
        </div>

        <div class="signal-section">
            <div class="signal-title">🚨 오늘의 매매신호</div>
            <div class="signal-content">
                <p><strong>[권고] TQQQ - 규직1 익절 신호</strong></p>
                <p style="margin-top: 10px;">현재가: $115.50 | 평단가: $98.20 | 수익률: +17.7%</p>
                <p style="margin-top: 10px;">15% 수익률 목표 도달. 익절을 권고합니다.</p>
            </div>
        </div>

        <div class="button-group">
            <button class="approve-btn" onclick="approveSignal()">✓ 승인하기</button>
            <button class="modify-btn" onclick="modifySignal()">✏️ 수정</button>
            <button class="reject-btn" onclick="rejectSignal()">✗ 거부</button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        function approveSignal() {
            const messageBox = document.getElementById('message');
            messageBox.textContent = '신호를 승인하는 중...';
            messageBox.className = 'message-box';
            
            fetch('/api/telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: 'signal',
                    data: { message: 'TQQQ 익절 신호 승인됨!' }
                })
            })
            .then(r => r.json())
            .then(data => {
                console.log('Telegram Response:', data);
                messageBox.textContent = '✅ 승인 완료! 텔레그램으로 알림이 발송되었습니다.';
                messageBox.className = 'message-box success';
            })
            .catch(e => {
                console.error('Error:', e);
                messageBox.textContent = '❌ 오류 발생: ' + e.message;
                messageBox.className = 'message-box error';
            });
        }

        function modifySignal() {
            alert('수정 기능은 준비 중입니다.');
        }

        function rejectSignal() {
            alert('거부되었습니다.');
        }
    </script>
</body>
</html>
